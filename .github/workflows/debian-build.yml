---
name: debian

on:
  workflow_dispatch:
  
  #schedule:
  #  - cron: "15 02 */28 * *" # Every 14-day @02:15
  #release:
  #  types:
  #    - published

env:
  postgres_jdbc_version: '42.7.13'
  postgres_jdbc_sha1: 'a6e1bd21b412d6ffb3df23cd13d507bc2cc9e37d'

jobs:
  build_and_publish:
    strategy:
      fail-fast: true
      matrix:
        os: ['ubuntu-latest']
        image:
          - name: docker.io/azul/zulu-openjdk-debian
            tag: '25-jre-headless'
        activemq:
          - ver: '6.2.9'
            sha512: '4179498a7132e6bbb41fd3396129383dd8106be4e5fd365b13abd5826b7e9685379ad5312ee802868ff1f0ad7bfda6b41c17fbd6d03cae7a1f77062939500c61'
          - ver: '6.3.1'
            sha512: 'bbef2edcfe9df51867d711f329f8ac61d46a16c713922d788751743fdbc32dcb7d8280ec433eec5a038aa26e7d0f19df33b701d00c0d098152ab3a4522b01929'
        #include : []
        #exclude: []
    
    permissions:
      packages: write
      contents: read

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          path: docker
      -
        name: Set up QEMU for Docker
        uses: docker/setup-qemu-action@v3
      -
        name: Setup Buildx for Docker
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      -
        name: Login to Docker Hub
        #if: true #github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.hub.docker.com # docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry (GHCR)
        if: false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Configure Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            registry.hub.docker.com/kdsda/activemq-classic
          flavor: |
            prefix=${{ matrix.activemq.ver }}-debian-${{ matrix.image.tag }}-
          tags: |
            type=schedule,pattern={{date 'YYYYMMDD-HHmmss' tz='Europe/Oslo'}}
            type=ref,event=branch
      -
        name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:src/debian"
          file: Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            base_image_name=${{ matrix.image.name }}
            base_image_version=${{ matrix.image.tag }}
            activemq_version=${{ matrix.activemq.ver }}
            activemq_sha512=${{ matrix.activemq.sha512 }}
            postgres_jdbc_version=${{ env.postgres_jdbc_version }}
            postgres_jdbc_sha1=${{ env.postgres_jdbc_sha1 }}

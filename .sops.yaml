keys: &default_keys
  age: 'age1dgxf5tas2w20995rusqry9gqak3clqy4wfz0r3xaexq0um74epcqv6y8nx'
  azure_keyvault:
    - 'https://krednokvsops.vault.azure.net/keys/sops-key-primary/'
    - 'https://krednokvsops.vault.azure.net/keys/sops-key-dev/'

stores:
  yaml:
    indent: 2
  json:
    indent: 2

creation_rules:
  -
    path_regex: ^.+\.(yml|yaml|json|env|ini)$
    <<: *default_keys
    encrypted_regex: '^(?i)(password|secret|token)$'
  -
    path_regex: .+
    <<: *default_keys
